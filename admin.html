<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>दल्लूसर Admin Panel</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f4f6f8;
      color:#222;
    }

    header{
      background:#166534;
      color:white;
      padding:18px;
      text-align:center;
    }

    header h1{
      font-size:23px;
    }

    header p{
      margin-top:5px;
      font-size:14px;
    }

    .container{
      max-width:700px;
      margin:20px auto;
      padding:15px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:14px;
      margin-bottom:20px;
      box-shadow:0 3px 12px rgba(0,0,0,.08);
    }

    .card h2{
      margin-bottom:15px;
      font-size:20px;
    }

    label{
      display:block;
      margin:12px 0 6px;
      font-weight:bold;
    }

    input,textarea{
      width:100%;
      padding:12px;
      border:1px solid #ddd;
      border-radius:9px;
      font-size:15px;
      outline:none;
    }

    textarea{
      min-height:120px;
      resize:vertical;
    }

    .check{
      display:flex;
      align-items:center;
      gap:8px;
      margin:15px 0;
    }

    .check input{
      width:auto;
    }

    button{
      border:0;
      padding:12px 18px;
      border-radius:9px;
      cursor:pointer;
      font-size:15px;
      font-weight:bold;
      margin-top:8px;
    }

    .publish{
      background:#166534;
      color:white;
      width:100%;
    }

    .delete{
      background:#dc2626;
      color:white;
      margin-right:8px;
    }

    .edit{
      background:#2563eb;
      color:white;
    }

    .notice{
      border:1px solid #e5e7eb;
      padding:15px;
      border-radius:12px;
      margin-top:12px;
    }

    .notice h3{
      margin-bottom:7px;
    }

    .notice p{
      color:#555;
      line-height:1.5;
    }

    .date{
      font-size:12px;
      color:#777;
      margin-top:8px;
    }

    .important{
      display:inline-block;
      background:#fee2e2;
      color:#b91c1c;
      padding:4px 8px;
      border-radius:20px;
      font-size:12px;
      margin-bottom:8px;
    }

    #message{
      margin-top:12px;
      text-align:center;
      font-weight:bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🏠 दल्लूसर Admin Panel</h1>
  <p>गाँव की सूचना प्रबंधन प्रणाली</p>
</header>

<div class="container">

  <!-- सूचना जोड़ने का फॉर्म -->
  <div class="card">

    <h2>📢 नई सूचना जोड़ें</h2>

    <label>सूचना का शीर्षक</label>
    <input
      type="text"
      id="title"
      placeholder="जैसे: ग्राम सभा की सूचना"
    >

    <label>सूचना का विवरण</label>
    <textarea
      id="description"
      placeholder="यहाँ पूरी सूचना लिखें..."
    ></textarea>

    <label>तारीख</label>
    <input
      type="date"
      id="date"
    >

    <div class="check">
      <input type="checkbox" id="important">
      <label for="important">🔴 महत्वपूर्ण सूचना</label>
    </div>

    <button class="publish" id="publishBtn">
      📢 सूचना Publish करें
    </button>

    <div id="message"></div>

  </div>


  <!-- पुरानी सूचनाएँ -->
  <div class="card">

    <h2>📋 सभी सूचनाएँ</h2>

    <div id="notices">
      सूचनाएँ लोड हो रही हैं...
    </div>

  </div>

</div>


<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    updateDoc,
    orderBy,
    query
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


  // Firebase Configuration

  const firebaseConfig = {
    apiKey: "AIzaSyAF4uC6jgeN7LXCm5w1l4G-P7-XWRT3P0A",
    authDomain: "dallusar-village-diary-a2c35.firebaseapp.com",
    projectId: "dallusar-village-diary-a2c35",
    storageBucket: "dallusar-village-diary-a2c35.firebasestorage.app",
    messagingSenderId: "771762232267",
    appId: "1:771762232267:web:aca8cb27ee6efb1fcab44e",
    measurementId: "G-0TKLN9WQ22"
  };


  // Firebase Start

  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  // Elements

  const titleInput = document.getElementById("title");
  const descriptionInput = document.getElementById("description");
  const dateInput = document.getElementById("date");
  const importantInput = document.getElementById("important");
  const publishBtn = document.getElementById("publishBtn");
  const message = document.getElementById("message");
  const noticesDiv = document.getElementById("notices");


  // आज की तारीख

  const today = new Date();

  const yyyy = today.getFullYear();

  const mm = String(today.getMonth() + 1).padStart(2,"0");

  const dd = String(today.getDate()).padStart(2,"0");

  dateInput.value = `${yyyy}-${mm}-${dd}`;


  // सूचना Publish

  publishBtn.addEventListener("click", async () => {

    const title = titleInput.value.trim();

    const description = descriptionInput.value.trim();

    const date = dateInput.value;

    const important = importantInput.checked;


    if(!title || !description || !date){

      message.textContent = "⚠️ सभी जानकारी भरें।";

      return;
    }


    try{

      publishBtn.disabled = true;

      publishBtn.textContent = "Publish हो रहा है...";


      await addDoc(
        collection(db,"notices"),
        {
          title: title,
          description: description,
          date: date,
          important: important,
          createdAt: Date.now()
        }
      );


      message.textContent = "✅ सूचना सफलतापूर्वक Publish हो गई!";

      titleInput.value = "";

      descriptionInput.value = "";

      importantInput.checked = false;

      await loadNotices();


    }catch(error){

      console.error(error);

      message.textContent =
        "❌ सूचना Publish नहीं हुई। Firebase Rules जाँचें।";

    }


    publishBtn.disabled = false;

    publishBtn.textContent = "📢 सूचना Publish करें";

  });


  // सभी सूचनाएँ Load

  async function loadNotices(){

    noticesDiv.innerHTML = "लोड हो रहा है...";


    try{

      const q = query(
        collection(db,"notices"),
        orderBy("createdAt","desc")
      );

      const snapshot = await getDocs(q);


      if(snapshot.empty){

        noticesDiv.innerHTML =
          "अभी कोई सूचना नहीं है।";

        return;

      }


      noticesDiv.innerHTML = "";


      snapshot.forEach((item) => {

        const data = item.data();

        const div = document.createElement("div");

        div.className = "notice";


        div.innerHTML = `

          ${
            data.important
            ? '<span class="important">🔴 महत्वपूर्ण</span>'
            : ''
          }

          <h3>${escapeHTML(data.title)}</h3>

          <p>${escapeHTML(data.description)}</p>

          <div class="date">
            📅 ${escapeHTML(data.date)}
          </div>

          <button
            class="delete"
            onclick="deleteNotice('${item.id}')">
            🗑️ Delete
          </button>

          <button
            class="edit"
            onclick="editNotice('${item.id}',
              '${escapeJS(data.title)}',
              '${escapeJS(data.description)}',
              '${escapeJS(data.date)}',
              ${data.important})">
            ✏️ Edit
          </button>

        `;


        noticesDiv.appendChild(div);

      });


    }catch(error){

      console.error(error);

      noticesDiv.innerHTML =
        "❌ सूचनाएँ लोड नहीं हो पाईं।";

    }

  }


  // Delete

  window.deleteNotice = async function(id){

    const confirmDelete =
      confirm("क्या आप यह सूचना Delete करना चाहते हैं?");

    if(!confirmDelete) return;


    try{

      await deleteDoc(
        doc(db,"notices",id)
      );

      message.textContent =
        "🗑️ सूचना Delete हो गई।";

      loadNotices();

    }catch(error){

      console.error(error);

      message.textContent =
        "❌ Delete नहीं हुआ।";

    }

  };


  // Edit

  window.editNotice = async function(
    id,
    oldTitle,
    oldDescription,
    oldDate,
    oldImportant
  ){

    const newTitle =
      prompt("सूचना का शीर्षक:",oldTitle);

    if(newTitle === null) return;


    const newDescription =
      prompt("सूचना का विवरण:",oldDescription);

    if(newDescription === null) return;


    const newDate =
      prompt("तारीख:",oldDate);

    if(newDate === null) return;


    const newImportant =
      confirm("क्या यह महत्वपूर्ण सूचना है?");


    try{

      await updateDoc(
        doc(db,"notices",id),
        {
          title:newTitle,
          description:newDescription,
          date:newDate,
          important:newImportant
        }
      );


      message.textContent =
        "✏️ सूचना Update हो गई।";

      loadNotices();


    }catch(error){

      console.error(error);

      message.textContent =
        "❌ Update नहीं हुआ।";

    }

  };


  // सुरक्षा के लिए HTML Escape

  function escapeHTML(text){

    return String(text)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");

  }


  function escapeJS(text){

    return String(text)
      .replace(/\\/g,"\\\\")
      .replace(/'/g,"\\'")
      .replace(/\n/g,"\\n")
      .replace(/\r/g,"");

  }


  // Start

  loadNotices();

</script>

</body>
</html>
