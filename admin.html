
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | दल्लूसर गाँव की डायरी</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #172033;
  padding: 20px;
}

.container {
  max-width: 700px;
  margin: auto;
}

h1 {
  color: #006b58;
  margin-bottom: 20px;
}

.card {
  background: white;
  padding: 22px;
  border-radius: 14px;
  margin-bottom: 20px;
  box-shadow: 0 3px 15px #00000010;
}

h2 {
  margin-bottom: 15px;
  color: #006b58;
}

input, textarea, select {
  width: 100%;
  padding: 13px;
  margin: 7px 0 15px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  min-height: 130px;
  resize: vertical;
}

button {
  background: #006b58;
  color: white;
  border: none;
  padding: 13px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  margin: 4px;
}

button:hover {
  background: #004d40;
}

button.danger {
  background: #dc2626;
}

button.secondary {
  background: #64748b;
}

.hidden {
  display: none;
}

#message {
  margin: 12px 0;
  font-weight: bold;
}

.news-item {
  border: 1px solid #e2e8f0;
  padding: 15px;
  border-radius: 10px;
  margin: 12px 0;
}

.news-item h3 {
  color: #006b58;
  margin-bottom: 8px;
}

.news-item img {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  border-radius: 8px;
  margin: 10px 0;
}

.small {
  color: #64748b;
  font-size: 14px;
  margin-bottom: 10px;
}

label {
  font-weight: bold;
}
</style>
</head>

<body>
<div class="container">

  <h1>दल्लूसर गाँव की डायरी</h1>

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="card">
    <h2>Admin Login</h2>

    <form id="loginForm">
      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="Admin Email"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">Login करें</button>
    </form>

    <p id="loginMessage"></p>
  </div>

  <!-- ADMIN SECTION -->
  <div id="adminSection" class="hidden">

    <div class="card">
      <h2>Admin Dashboard</h2>
      <p id="userEmail" class="small"></p>
      <button id="logoutBtn" class="secondary">Logout</button>
    </div>

    <!-- NEWS FORM -->
    <div class="card">
      <h2 id="formTitle">नई खबर जोड़ें</h2>

      <form id="newsForm">

        <label>खबर का शीर्षक</label>
        <input
          type="text"
          id="newsTitle"
          placeholder="जैसे: गाँव में नई सड़क का निर्माण"
          required
        >

        <label>खबर की श्रेणी</label>
        <select id="newsCategory">
          <option value="गाँव की खबर">गाँव की खबर</option>
          <option value="शिक्षा">शिक्षा</option>
          <option value="कृषि">कृषि</option>
          <option value="सरकारी योजना">सरकारी योजना</option>
          <option value="खेल">खेल</option>
          <option value="अन्य">अन्य</option>
        </select>

        <label>खबर का विवरण</label>
        <textarea
          id="newsDescription"
          placeholder="खबर की पूरी जानकारी लिखें..."
          required
        ></textarea>

        <label>फोटो का URL (वैकल्पिक)</label>
        <input
          type="url"
          id="newsImage"
          placeholder="https://example.com/photo.jpg"
        >

        <label>खबर की तारीख</label>
        <input type="date" id="newsDate" required>

        <button type="submit" id="saveBtn">
          खबर सेव करें
        </button>

        <button
          type="button"
          id="cancelBtn"
          class="secondary hidden"
        >
          एडिट रद्द करें
        </button>
      </form>

      <p id="message"></p>
    </div>

    <!-- NEWS LIST -->
    <div class="card">
      <h2>आपकी खबरें</h2>
      <div id="newsList">खबरें लोड हो रही हैं...</div>
    </div>

  </div>
</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  doc,
  updateDoc,
  deleteDoc,
  query,
  orderBy,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAF4uC6jgeN7LXCm5w1l4G-P7-XWRT3P0A",
  authDomain: "dallusar-village-diary-a2c35.firebaseapp.com",
  projectId: "dallusar-village-diary-a2c35",
  storageBucket: "dallusar-village-diary-a2c35.firebasestorage.app",
  messagingSenderId: "771762232267",
  appId: "1:771762232267:web:aca8cb27ee6efb1fcab44e",
  measurementId: "G-0TKLN9WQ22"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginSection = document.getElementById("loginSection");
const adminSection = document.getElementById("adminSection");
const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");
const newsForm = document.getElementById("newsForm");
const newsList = document.getElementById("newsList");
const message = document.getElementById("message");
const saveBtn = document.getElementById("saveBtn");
const cancelBtn = document.getElementById("cancelBtn");

let editingId = null;

// आज की तारीख
document.getElementById("newsDate").value =
  new Date().toISOString().split("T")[0];

// LOGIN
loginForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  loginMessage.textContent = "Login हो रहा है...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
    loginMessage.textContent = "";
    loginForm.reset();
  } catch (error) {
  
  } catch (error) {
    console.error("Firebase Login Error:", error);

    loginMessage.textContent =
      "Error Code: " + (error.code || "unknown") +
      "\n" + (error.message || "अज्ञात समस्या");

    loginMessage.style.color = "red";
    loginMessage.style.whiteSpace = "pre-wrap";
}
                           }
});

// AUTH STATE
onAuthStateChanged(auth, (user) => {
  if (user) {
    loginSection.classList.add("hidden");
    adminSection.classList.remove("hidden");

    document.getElementById("userEmail").textContent =
      "Logged in: " + user.email;

    loadNews();
  } else {
    loginSection.classList.remove("hidden");
    adminSection.classList.add("hidden");
  }
});

// LOGOUT
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
});

// SAVE OR UPDATE NEWS
newsForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const user = auth.currentUser;
  if (!user) {
    message.textContent = "पहले Login करें।";
    return;
  }

  const title = document.getElementById("newsTitle").value.trim();
  const category = document.getElementById("newsCategory").value;
  const description = document.getElementById("newsDescription").value.trim();
  const image = document.getElementById("newsImage").value.trim();
  const date = document.getElementById("newsDate").value;

  if (!title || !description || !date) {
    message.textContent = "कृपया सभी जरूरी जानकारी भरें।";
    return;
  }

  saveBtn.disabled = true;
  message.textContent = "सेव हो रहा है...";

  try {
    const newsData = {
      title,
      category,
      description,
      image,
      date,
      updatedAt: serverTimestamp()
    };

    if (editingId) {
      await updateDoc(
        doc(db, "news", editingId),
        newsData
      );

      message.textContent = "खबर अपडेट हो गई।";
    } else {
      await addDoc(collection(db, "news"), {
        ...newsData,
        createdAt: serverTimestamp(),
        author: user.email
      });

      message.textContent = "खबर सफलतापूर्वक जोड़ दी गई।";
    }

    resetForm();
    await loadNews();

  } catch (error) {
    message.textContent =
      "सेव करने में समस्या: " + getErrorMessage(error);
  }

  saveBtn.disabled = false;
});

// LOAD NEWS
async function loadNews() {
  newsList.textContent = "खबरें लोड हो रही हैं...";

  try {
    const newsQuery = query(
      collection(db, "news"),
      orderBy("createdAt", "desc")
    );

    const snapshot = await getDocs(newsQuery);

    newsList.innerHTML = "";

    if (snapshot.empty) {
      newsList.textContent = "अभी कोई खबर नहीं है।";
      return;
    }

    snapshot.forEach((item) => {
      const news = item.data();
      const id = item.id;

      const box = document.createElement("div");
      box.className = "news-item";

      const heading = document.createElement("h3");
      heading.textContent = news.title || "";

      const info = document.createElement("p");
      info.className = "small";
      info.textContent =
        (news.category || "अन्य") + " | " + (news.date || "");

      const description = document.createElement("p");
      description.textContent = news.description || "";

      box.appendChild(heading);
      box.appendChild(info);

      if (news.image) {
        const img = document.createElement("img");
        img.src = news.image;
        img.alt = news.title || "खबर की फोटो";
        img.loading = "lazy";
        img.onerror = () => img.remove();
        box.appendChild(img);
      }

      box.appendChild(description);

      const editButton = document.createElement("button");
      editButton.textContent = "एडिट";
      editButton.addEventListener("click", () => {
        editNews(id, news);
      });

      const deleteButton = document.createElement("button");
      deleteButton.textContent = "डिलीट";
      deleteButton.className = "danger";
      deleteButton.addEventListener("click", () => {
        removeNews(id);
      });

      box.appendChild(editButton);
      box.appendChild(deleteButton);
      newsList.appendChild(box);
    });

  } catch (error) {
    newsList.textContent =
      "खबरें लोड नहीं हो सकीं: " + getErrorMessage(error);
  }
}

// EDIT NEWS
function editNews(id, news) {
  editingId = id;

  document.getElementById("newsTitle").value = news.title || "";
  document.getElementById("newsCategory").value = news.category || "अन्य";
  document.getElementById("newsDescription").value = news.description || "";
  document.getElementById("newsImage").value = news.image || "";
  document.getElementById("newsDate").value = news.date || "";

  document.getElementById("formTitle").textContent = "खबर एडिट करें";
  saveBtn.textContent = "अपडेट करें";
  cancelBtn.classList.remove("hidden");

  window.scrollTo({ top: 0, behavior: "smooth" });
}

// DELETE NEWS
async function removeNews(id) {
  const confirmDelete = confirm(
    "क्या आप इस खबर को डिलीट करना चाहते हैं?"
  );

  if (!confirmDelete) return;

  try {
    await deleteDoc(doc(db, "news", id));
    message.textContent = "खबर डिलीट हो गई।";
    await loadNews();
  } catch (error) {
    message.textContent =
      "डिलीट करने में समस्या: " + getErrorMessage(error);
  }
}

// RESET FORM
function resetForm() {
  editingId = null;
  newsForm.reset();

  document.getElementById("newsDate").value =
    new Date().toISOString().split("T")[0];

  document.getElementById("formTitle").textContent = "नई खबर जोड़ें";
  saveBtn.textContent = "खबर सेव करें";
  cancelBtn.classList.add("hidden");
}

cancelBtn.addEventListener("click", resetForm);

// ERROR MESSAGES
function getErrorMessage(error) {
  const code = error?.code || "";

  if (code.includes("invalid-credential")) {
    return "Email या Password गलत है।";
  }

  if (code.includes("operation-not-allowed")) {
    return "Firebase में Email/Password Login चालू करें।";
  }

  if (code.includes("permission-denied")) {
    return "Firestore Rules में अनुमति नहीं है।";
  }

  if (code.includes("failed-precondition")) {
    return "Firestore Database या Index की जाँच करें।";
  }

  return error?.message || "अज्ञात समस्या";
}

</script>
</body>
</html>
