/* =========================================
   🔐 GOOGLE LOGIN
========================================= */

window.googleLogin = async function(){

  try{

    const result =
      await signInWithPopup(auth,provider);

    const user = result.user;


    /*
     * केवल Admin Gmail
     */

    if(
      !user.email ||
      user.email.toLowerCase() !==
      ADMIN_EMAIL.toLowerCase()
    ){

      await signOut(auth);

      alert(
        "❌ इस Gmail को Admin की अनुमति नहीं है।"
      );

      return;

    }


    alert(
      "✅ Admin Login सफल!\n\n" +
      user.email
    );

  }catch(error){

    console.error(
      "Google Login Error:",
      error
    );

    alert(
      "❌ Google Login में समस्या हुई।\n\n" +
      error.message
    );

  }

};

/* =========================================
   🔐 LOGIN STATUS
========================================= */

function watchAdminLogin(){

  onAuthStateChanged(
    auth,
    (user)=>{

      const status =
        document.getElementById("loginStatus");

      const loginButton =
        document.getElementById("googleLoginBtn");

      const publishBox =
        document.getElementById("publishBox");


      if(
        user &&
        user.email &&
        user.email.toLowerCase() ===
        ADMIN_EMAIL.toLowerCase()
      ){

        status.textContent =
          "✅ Admin Login: " + user.email;

        loginButton.style.display =
          "none";

        publishBox.style.display =
          "block";

      }else{

        status.textContent =
          "🔐 सूचना प्रकाशित करने के लिए Google से Login करें।";

        loginButton.style.display =
          "block";

        publishBox.style.display =
          "none";

      }

    }
  );

}


/* =========================================
   📢 PUBLISH NOTICE
========================================= */

window.publishNotice = async function(){

  const user =
    auth.currentUser;


  /*
   * Admin verification
   */

  if(
    !user ||
    !user.email ||
    user.email.toLowerCase() !==
    ADMIN_EMAIL.toLowerCase()
  ){

    alert(
      "❌ पहले Admin Gmail से Login करें।"
    );

    return;

  }


  const title =
    document
      .getElementById("noticeTitle")
      .value
      .trim();


  const description =
    document
      .getElementById("noticeDescription")
      .value
      .trim();


  const date =
    document
      .getElementById("noticeDate")
      .value;


  const important =
    document
      .getElementById("noticeImportant")
      .checked;


  if(!title){

    alert(
      "⚠️ कृपया सूचना का शीर्षक लिखें।"
    );

    return;

  }


  if(!description){

    alert(
      "⚠️ कृपया सूचना लिखें।"
    );

    return;

  }


  try{

    await addDoc(
      collection(db,"notices"),
      {

        title: title,

        description: description,

        date:
          date ||
          new Date()
            .toLocaleDateString("hi-IN"),

        important: important,

        createdAt: Date.now(),

        publishedBy: user.email

      }
    );


    alert(
      "✅ सूचना सफलतापूर्वक प्रकाशित हो गई!"
    );


    document
      .getElementById("noticeTitle")
      .value = "";


    document
      .getElementById("noticeDescription")
      .value = "";


    document
      .getElementById("noticeDate")
      .value = "";


    document
      .getElementById("noticeImportant")
      .checked = false;


  }catch(error){

    console.error(
      "Publish Notice Error:",
      error
    );

    alert(
      "❌ सूचना प्रकाशित नहीं हुई।\n\n" +
      error.message
    );

  }

};


/* =========================================
   📢 NOTICES
========================================= */

function loadNotices(){

  if(!db) return;


  /*
   * orderBy हटाया गया है।
   * इससे पुराने documents जिनमें createdAt नहीं है,
   * वे भी समस्या नहीं करेंगे।
   */

  onSnapshot(

    collection(db,"notices"),

    (snapshot)=>{

      const noticeText =
        document.getElementById("noticeText");

      const newsList =
        document.getElementById("newsList");


      if(snapshot.empty){

        noticeText.textContent =
          "दल्लूसर गाँव से जुड़ी महत्वपूर्ण खबरें और सूचनाएँ यहाँ दिखाई जाएँगी।";

        return;

      }


      let notices = [];


      snapshot.forEach(doc=>{

        notices.push({
          id:doc.id,
          ...doc.data()
        });

      });


      /*
       * Latest first
       */

      notices.sort(
        (a,b)=>
          (Number(b.createdAt)||0) -
          (Number(a.createdAt)||0)
      );


      /*
       * सबसे नई सूचना
       */

      const first =
        notices[0];


      noticeText.textContent =
        (first.title || "नई सूचना") +
        " — " +
        (first.description || "");


      /*
       * News list
       */

      newsList.innerHTML = "";


      notices.forEach(data=>{

        const div =
          document.createElement("div");

        div.className =
          "data-card";


        const badge =
          data.important
          ? '<span class="badge">🔴 महत्वपूर्ण सूचना</span>'
          : "";


        div.innerHTML = `

          ${badge}

          <h3>
            ${safe(data.title || "नई सूचना")}
          </h3>

          <p>
            ${safe(data.description || "")}
          </p>

          <small>
            📅 ${safe(data.date || "")}
          </small>

        `;


        newsList.appendChild(div);

      });

    },

    (error)=>{

      console.error(
        "Notices load error:",
        error
      );

    }

  );

}


/* =========================================
   📰 NEWS
========================================= */

function loadNews(){

  if(!db) return;


  const q = query(
    collection(db,"news"),
    orderBy("createdAt","desc")
  );


  onSnapshot(

    q,

    (snapshot)=>{

      const list =
        document.getElementById("newsList");


      if(snapshot.empty)
        return;


      snapshot.forEach(doc=>{

        const data =
          doc.data();


        const div =
          document.createElement("div");


        div.className =
          "data-card";


        div.innerHTML = `

          <h3>
            ${safe(data.title || "नई खबर")}
          </h3>

          <p>
            ${safe(data.description || "")}
          </p>

        `;


        list.appendChild(div);

      });

    },

    (error)=>{

      console.error(
        "News load error:",
        error
      );

    }

  );

}

        "Gallery load error:",
        error
      );

    }

  );

}


/* =========================================
   🛡️ SAFE TEXT
========================================= */

function safe(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
